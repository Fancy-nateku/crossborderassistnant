openapi: 3.1.0
info:
  title: CrossBorder Assist API
  version: 1.0.0
  description: Express API contract. Guest plans stay in browser storage; saved-plan and admin endpoints remain protected.
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    authjsSession:
      type: apiKey
      in: cookie
      name: authjs.session-token
paths:
  /health:
    get:
      responses:
        "200":
          description: Service process is running.
  /ready:
    get:
      responses:
        "200":
          description: The database is reachable.
        "503":
          description: The database is unavailable.
  /api/v1/borders:
    get:
      parameters:
        - in: query
          name: active
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Border reference data.
  /api/v1/borders/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Border details.
        "404":
          description: Border not found.
  /api/v1/products:
    get:
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 60
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Search result page.
  /api/v1/products/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Product details.
        "404":
          description: Product not found.
  /api/v1/exchange-rates/{currency}:
    get:
      parameters:
        - in: path
          name: currency
          required: true
          schema:
            type: string
            enum: [KES, UGX]
      responses:
        "200":
          description: Latest admin-set rate; illustrative status is included.
        "404":
          description: No rate is available.
  /api/v1/thresholds/str:
    get:
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            enum: [KE, UG]
        - in: query
          name: to
          required: true
          schema:
            type: string
            enum: [KE, UG]
        - in: query
          name: borderId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        "200":
          description: The current verified STR threshold, or null when it cannot be confirmed.
        "404":
          description: Border not found or inactive.
        "422":
          description: Route does not match the selected border.
  /api/v1/plan-previews:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, borderId, productId, quantity, unit, currency, valueLocal]
              properties:
                from:
                  type: string
                  enum: [KE, UG]
                to:
                  type: string
                  enum: [KE, UG]
                borderId:
                  type: string
                  minLength: 1
                  maxLength: 50
                productId:
                  type: [string, "null"]
                  maxLength: 80
                quantity:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 1000000000
                unit:
                  type: string
                  enum: [bags, kilograms, crates]
                currency:
                  type: string
                  enum: [KES, UGX]
                valueLocal:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000000000
      responses:
        "200":
          description: Server-calculated preview, possibly with cannot_confirm.
        "400":
          description: Invalid request.
        "404":
          description: Border or product not found.
        "422":
          description: Route or border is invalid.
        "429":
          description: Rate limit exceeded.
  /api/v1/saved-plans:
    get:
      security:
        - authjsSession: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Plans owned by the authenticated user; private and no-store.
        "401":
          description: No valid session.
        "503":
          description: Authentication secret is not configured.
    post:
      security:
        - authjsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/paths/~1api~1v1~1plan-previews/post/requestBody/content/application~1json/schema"
      responses:
        "201":
          description: Saved plan and initial checklist created atomically.
        "401":
          description: No valid session.
        "403":
          description: Origin is not allowlisted.
  /api/v1/saved-plans/{id}:
    get:
      security:
        - authjsSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Historical snapshot owned by the authenticated user.
        "404":
          description: Plan not found or not owned by the current user.
    delete:
      security:
        - authjsSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 80
      responses:
        "204":
          description: The owned plan and its checklist were deleted.
        "404":
          description: Plan not found or not owned by the current user.
  /api/v1/saved-plans/{id}/checklist-items/{requirementId}:
    patch:
      security:
        - authjsSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 80
        - in: path
          name: requirementId
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [done]
              properties:
                done:
                  type: boolean
      responses:
        "200":
          description: Checklist progress after idempotent update.
        "404":
          description: Plan or checklist item not found for the current user.
  /api/v1/admin/sources:
    post:
      security:
        - authjsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, minLength: 1, maxLength: 50 }
                name: { type: string, minLength: 1, maxLength: 255 }
                url: { type: [string, "null"], format: uri }
                publishedAt: { type: [string, "null"], format: date }
                lastVerifiedAt: { type: [string, "null"], format: date }
                status: { type: string, enum: [verified, unverified, conflicting], default: unverified }
                notes: { type: [string, "null"] }
      responses:
        "201": { description: Source and audit entry created. }
        "400": { description: Invalid source or verification metadata. }
        "401": { description: No valid session. }
        "403": { description: Administrator role or permitted origin required. }
  /api/v1/admin/requirements:
    post:
      security:
        - authjsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, title, plainExplanation, sourceIds]
              properties:
                id: { type: string, minLength: 1, maxLength: 50 }
                title: { type: string, minLength: 1, maxLength: 200 }
                plainExplanation: { type: string, minLength: 1 }
                officialFee: { type: [string, "null"] }
                whereToObtain: { type: [string, "null"] }
                sourceIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 50 }
                caveat:
                  type: [object, "null"]
                  additionalProperties: false
                  required: [subject, body]
                  properties:
                    subject: { type: [string, "null"] }
                    body: { type: string, minLength: 1 }
      responses:
        "201": { description: Requirement and audit entry created. }
        "400": { description: Invalid requirement or source references. }
        "401": { description: No valid session. }
        "403": { description: Administrator role or permitted origin required. }
  /api/v1/admin/rules:
    post:
      security:
        - authjsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, version, from, to, verdict, requirementIds, sourceId, effectiveFrom]
              properties:
                id: { type: string, minLength: 1, maxLength: 50 }
                version: { type: integer, minimum: 1 }
                from: { type: string, enum: [KE, UG] }
                to: { type: string, enum: [KE, UG] }
                borderIds: { type: array, uniqueItems: true, items: { type: string } }
                commonList: { type: string, enum: [yes, no, unknown] }
                valueUsdAbove: { type: number, exclusiveMinimum: 0 }
                valueUsdUpTo: { type: number, exclusiveMinimum: 0 }
                verdict: { type: string, enum: [likely_str_eligible, above_threshold, not_on_common_list] }
                requirementIds: { type: array, uniqueItems: true, items: { type: string } }
                sourceId: { type: string, minLength: 1, maxLength: 50 }
                effectiveFrom: { type: string, format: date }
                status: { type: string, enum: [active, draft, retired], default: active }
                priority: { type: integer, default: 0 }
                verifiedAt: { type: string, format: date }
      responses:
        "201": { description: Rule version and audit entry created. }
        "400": { description: Invalid rule, source, border, or requirement references. }
        "401": { description: No valid session. }
        "403": { description: Administrator role or permitted origin required. }
  /api/v1/admin/exchange-rates:
    post:
      security:
        - authjsSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency, ratePerUsd, setAt]
              properties:
                currency: { type: string, enum: [KES, UGX] }
                ratePerUsd: { type: number, exclusiveMinimum: 0 }
                setAt: { type: string, format: date }
                illustrative: { type: boolean, default: false }
      responses:
        "201": { description: Exchange-rate snapshot and audit entry created. }
        "400": { description: Invalid exchange rate or date. }
        "401": { description: No valid session. }
        "403": { description: Administrator role or permitted origin required. }
  /api/v1/admin/audit-logs:
    get:
      security:
        - authjsSession: []
      parameters:
        - in: query
          name: entityType
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Recent audit events; private and no-store. }
        "401": { description: No valid session. }
        "403": { description: Administrator role required. }
