databases:
  - name: crossborder-db
    plan: free
    databaseName: crossborder
    user: crossborder

services:
  - type: web
    name: crossborder-backend
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /health
    # prisma CLI is a devDependency, so install dev deps too.
    buildCommand: npm ci --include=dev && npm run build:backend
    # Free tier has no preDeployCommand, so migrate on every start.
    startCommand: npx prisma migrate deploy --schema prisma/schema.prisma && npm run start:backend
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crossborder-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://crossborderassistnant.vercel.app
      - key: SOURCE_MAX_AGE_DAYS
        value: "30"
      - key: EXCHANGE_RATE_MAX_AGE_DAYS
        value: "30"
      # Must equal AUTH_SECRET on the Vercel project (Auth.js tokens are verified here).
      - key: AUTH_SECRET
        sync: false
